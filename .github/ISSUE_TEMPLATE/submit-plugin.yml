name: "\U0001F50C Submit Plugin to Marketplace"
description: Propose a new plugin to be listed in the docmd marketplace catalogue
title: "[Submit Plugin]: "
labels: ["plugin-submission", "marketplace"]
body:
  - type: markdown
    attributes:
      value: |
        ### Submit a Plugin to the docmd Marketplace

        Thank you for contributing to the **docmd Marketplace** ecosystem! Please fill in the details below.

        Once reviewed, you can either open a pull request updating `data/plugins.json` or our team can list the plugin on your behalf once authorization and package integrity are confirmed.

  - type: input
    id: name
    attributes:
      label: Plugin Display Name
      description: The canonical user-facing name of the plugin.
      placeholder: e.g. Algolia Search
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: Plugin Slug
      description: URL-safe identifier used on docmd.io/plugins/ (lowercase letters, numbers, and hyphens only).
      placeholder: e.g. algolia
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Plugin Type
      description: Specify whether this is an installable community plugin or a built-in core candidate.
      options:
        - installable (Community / external npm package)
        - builtin (Candidate for docmd core built-ins)
    validations:
      required: true

  - type: input
    id: npm_package
    attributes:
      label: npm Package Name
      description: The published npm package name (e.g. @docmd/plugin-algolia or docmd-plugin-algolia).
      placeholder: e.g. @docmd/plugin-algolia
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: Public Git repository where the source code is hosted.
      placeholder: https://github.com/username/docmd-plugin-algolia
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Current Version
      description: Latest semver release of the package.
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: textarea
    id: tagline
    attributes:
      label: Short Tagline
      description: A concise one-sentence summary displayed on the marketplace card (max 100 characters).
      placeholder: e.g. Fast, typo-tolerant full-text search powered by Algolia.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Full Description
      description: Detailed overview of what the plugin does, why users need it, and how it works.
      placeholder: e.g. Adds an in-page search bar and compile-time index generator for Algolia...
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated keywords for filtering in the marketplace.
      placeholder: search, indexing, algolia
    validations:
      required: true

  - type: checkboxes
    id: capabilities
    attributes:
      label: Capabilities / Lifecycle Hooks
      description: Select all docmd lifecycle hooks this plugin registers or uses.
      options:
        - label: "init — runs during plugin initialization"
        - label: "head — injects scripts or stylesheets into the HTML head"
        - label: "body — injects elements into the page body"
        - label: "assets — copies static assets to the site directory"
        - label: "actions — exposes CLI or build actions"
        - label: "translations — registers custom i18n dictionary keys"
        - label: "post-build — executes after site compilation completes"

  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions and Runtime Behavior
      description: Declare the runtime behavior of this plugin during a build.
      options:
        - label: "Reads project files (readsProject)"
        - label: "Writes to the site directory (writesSite)"
        - label: "Makes network requests (network)"
        - label: "Runs subprocesses (subprocess)"

  - type: textarea
    id: config_example
    attributes:
      label: Configuration Example
      description: Minimal configuration example for docmd.config.js or docmd.json.
      render: javascript
      placeholder: |
        module.exports = {
          plugins: [
            ['docmd-plugin-algolia', {
              appId: 'YOUR_APP_ID',
              apiKey: 'YOUR_SEARCH_KEY',
              indexName: 'my_docs'
            }]
          ]
        };
    validations:
      required: false

  - type: textarea
    id: icon
    attributes:
      label: Icon
      description: Paste inline SVG markup (24x24 viewBox, stroke=currentColor, fill=none) or describe the icon you would like used.
      placeholder: Paste SVG markup here, or describe the icon (e.g. "a magnifying glass")
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification and Authorization Checklist
      description: Please confirm the following before submitting.
      options:
        - label: I am the author or maintainer of this plugin, or I have confirmed authorization to submit it.
          required: true
        - label: The plugin is published under an OSI-approved open source license (MIT, Apache 2.0, BSD, etc.).
          required: true
        - label: The package is published on npm and the repository is publicly accessible.
          required: true
        - label: I understand that once verified, I can submit a PR to add it to data/plugins.json or request the docmd team to list it.
          required: true
